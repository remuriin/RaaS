# The web server inside the web app's container. It only serves the built files.
#
# The same rules the VPS's nginx applied when it served these files from disk
# (RAG-API/deploy/nginx/app-location.conf). The security headers and the Content-Security-Policy
# are NOT set here: the VPS's nginx, which sits in front of this container, still adds them.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # index.html names the hashed files, so it must never be cached: a stale copy would ask for
    # files a newer build no longer has
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # a hashed file's name changes whenever its content does, so it can be kept for a year;
    # a missing one is a real 404, never the app's page.
    # No "always" here on purpose: the year applies to files that exist, not to a 404. While an update
    # is rolling out, the old pod can be asked for a file only the new one has, and a browser must not
    # remember that answer.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # a real file (favicon.svg, theme.js) is sent as is; any other address is one of the app's own pages
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # for Kubernetes to ask "are you up?", without filling the log
    location = /healthz {
        access_log off;
        default_type text/plain;
        # TEST: a build that never becomes ready (to be reverted)
        return 503 "broken on purpose\n";
    }
}
