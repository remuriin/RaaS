# "Keep one pod of the web app's image running." Kubernetes creates the pod, restarts it if it dies,
# and replaces it when the image changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: rem-raas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # ":main" is the newest build of the main branch. A deploy replaces it with one exact build:
          #   kubectl -n rem-raas set image deployment/web web=ghcr.io/remuriin/raas-web:<commit>
          image: ghcr.io/remuriin/raas-web:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # traffic is only sent to the pod once this answers, so a new version takes over
          # only when it is really up
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          # requests: what it is promised. limits: the ceiling it can never go over.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
