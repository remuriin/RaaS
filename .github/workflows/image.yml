# Builds the web app's container image and puts it in GitHub's registry, where the cluster downloads it from.
# The VPS never builds anything.
name: image

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/image.yml'
  # also a "Run workflow" button on the Actions page
  workflow_dispatch:

# only pushes to this repository run it; a pull request from a fork never does
permissions:
  contents: read
  packages: write

# two pushes in a row build one after the other, never at once
concurrency: image

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          # the VPS is ARM. The app is built on this machine's own CPU (see the Dockerfile); only the
          # final image is ARM, and it runs no commands while being built, so nothing is emulated.
          platforms: linux/arm64
          push: true
          # one tag that names this exact commit, and "main" that always points at the newest
          tags: |
            ghcr.io/remuriin/raas-web:${{ github.sha }}
            ghcr.io/remuriin/raas-web:main
          # the four Firebase values, kept as repository variables (they are public identifiers)
          build-args: |
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          labels: |
            org.opencontainers.image.source=https://github.com/remuriin/RaaS
