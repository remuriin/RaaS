# On a push to main: check the web app, build its container image and push it to ghcr.io.
# Flux, in the cluster, sees the new main-<commit>-<commit time> tag and deploys it (repo Fleet).
# The VPS never builds anything, and nothing here logs in to it.
name: image

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/image.yml'
  # also a "Run workflow" button on the Actions page
  workflow_dispatch:

# only pushes to this repository run it; a pull request from a fork never does
permissions:
  contents: read
  packages: write

# two pushes in a row run one after the other, never at once
concurrency: image

jobs:
  # the linter. The type check is part of the build itself ("tsc -b"), so a type error stops the next job.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the commit's own time, for the tag Flux sorts by: re-running an old run never sorts above a newer build
      - name: commit time
        id: ts
        run: echo "ts=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          # the VPS is ARM. The app is built on this machine's own CPU (see the Dockerfile); only the
          # final image is ARM, and it runs no commands while being built, so nothing is emulated.
          platforms: linux/arm64
          push: true
          # one tag that names this exact commit, "main" that always points at the newest,
          # and main-<commit>-<commit time>, the one Flux picks the newest build by
          tags: |
            ghcr.io/remuriin/raas-web:${{ github.sha }}
            ghcr.io/remuriin/raas-web:main
            ghcr.io/remuriin/raas-web:main-${{ github.sha }}-${{ steps.ts.outputs.ts }}
          # the four Firebase values, kept as repository variables (they are public identifiers)
          build-args: |
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          labels: |
            org.opencontainers.image.source=https://github.com/remuriin/RaaS
